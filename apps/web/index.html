<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Self-hosted, file-first personal AI assistant built on Pi." />
    <title>Memora</title>
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Memora" />
    <meta property="og:description" content="Self-hosted, file-first personal AI assistant built on Pi." />
    <meta property="og:image" content="https://github.com/lian84/memora/raw/main/apps/web/public/brand/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (() => {
        try {
          const stored = JSON.parse(localStorage.getItem('memora-appearance') || 'null') || {};
          const theme = stored.theme === 'light' || stored.theme === 'dark'
            ? stored.theme
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          const root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.themeMode = stored.theme || 'system';
          root.dataset.fontSize = stored.fontSize || 'normal';
          root.dataset.density = stored.density || 'comfortable';
          root.dataset.chatWidth = stored.wideChat ? 'wide' : 'standard';
          root.dataset.reducedMotion = stored.reducedMotion ? 'true' : 'false';
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
